version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: be4breach
      POSTGRES_PASSWORD: be4breach
      POSTGRES_DB: be4breach
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg2://be4breach:be4breach@db:5432/be4breach
      ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: change_me_super_secret_key
    depends_on:
      - db
    ports:
      - "8000:8000"

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  db_data:
