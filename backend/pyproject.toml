[project]
name = "be4breach-backend"
version = "0.1.0"
description = "Be4Breach FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic",
  "authlib",
  "bcrypt",
  "fastapi",
  "httpx",
  "psycopg[binary]",
  "pydantic-settings",
  "python-jose[cryptography]",
  "python-multipart",
  "sqlalchemy",
  "uvicorn[standard]"
]

[project.optional-dependencies]
dev = [
  "aiosqlite",
  "pytest",
  "pytest-asyncio"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
package-dir = {"" = "."}
