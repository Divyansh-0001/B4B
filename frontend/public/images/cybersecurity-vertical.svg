<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#0A0A0A"/>
  
  <!-- Shield with circuit pattern -->
  <g transform="translate(150, 80)">
    <path d="M150 0L50 40V140C50 200 105 240 150 250C195 240 250 200 250 140V40L150 0Z" fill="#E10600" opacity="0.1"/>
    <path d="M150 10L60 45V140C60 195 110 230 150 240C190 230 240 195 240 140V45L150 10Z" stroke="#E10600" stroke-width="3" fill="none"/>
    
    <!-- Circuit lines -->
    <line x1="120" y1="100" x2="180" y2="100" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="150" y1="70" x2="150" y2="130" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <circle cx="120" cy="100" r="4" fill="#E10600"/>
    <circle cx="180" cy="100" r="4" fill="#E10600"/>
    <circle cx="150" cy="70" r="4" fill="#E10600"/>
    <circle cx="150" cy="130" r="4" fill="#E10600"/>
    
    <!-- Lock icon -->
    <rect x="135" y="95" width="30" height="25" rx="3" fill="#FFFFFF"/>
    <path d="M140 95V85C140 77 145 72 150 72C155 72 160 77 160 85V95" stroke="#E10600" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Text -->
  <text x="300" y="160" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">
    Cybersecurity
  </text>
  <text x="300" y="200" font-family="Arial, sans-serif" font-size="24" fill="#999999">
    Offensive & Defensive Security
  </text>
  
  <!-- Red accent line -->
  <rect x="300" y="220" width="100" height="4" fill="#E10600"/>
</svg>
